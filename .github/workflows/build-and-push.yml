# This is a GitHub Actions workflow to automatically build and push Docker images.

name: Build and Push Docker Images

# This action runs automatically whenever you push a change to the 'stable' branch.
on:
  push:
    branches: [ "stable" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest # Use a standard Linux worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Step 1: Download your code to the worker

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 # Step 2: Log into Docker Hub using your secrets
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push archon-server
        uses: docker/build-push-action@v5
        with:
          context: ./python
          file: ./python/Dockerfile.server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/archon-server:latest

      - name: Build and push archon-mcp
        uses: docker/build-push-action@v5
        with:
          context: ./python
          file: ./python/Dockerfile.mcp
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/archon-mcp:latest

      - name: Build and push archon-agents
        uses: docker/build-push-action@v5
        with:
          context: ./python
          file: ./python/Dockerfile.agents
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/archon-agents:latest
          
      - name: Build and push archon-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./archon-ui-main
          file: ./archon-ui-main/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/archon-frontend:latest
